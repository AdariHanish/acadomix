[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Redirect all /api/* calls to our single Express Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React Router catch-all for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
